[project]
name = "eegdementia"
version = "0.2.0.dev0"
description = "Leak-free, subject-level evaluation of AD / FTD / CN classification from resting-state EEG (OpenNeuro ds004504)"
readme = "README.md"
license = { text = "Unlicense" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "mne>=1.8",
    "pyriemann>=0.7",
    "specparam>=2.0.0rc1",
    "lightgbm>=4.5",
    "antropy>=0.1.6",
    "joblib>=1.4",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eegdementia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
