[project]
name = "eegdementia"
version = "0.2.0.dev0"
description = "Leak-free, subject-level evaluation of AD / FTD / CN classification from resting-state EEG (OpenNeuro ds004504): spectral features, Riemannian models, EEG foundation models and CNNs under one nested cross-validation harness"
readme = "README.md"
license = "Unlicense"
license-files = ["LICENSE"]
authors = [
    { name = "Keshav Rajput" },
    { name = "Subhrajit Dey" },
    { name = "Sirish Visweswar" },
    { name = "terka2610" },
]
keywords = ["EEG", "dementia", "Alzheimer's disease", "frontotemporal dementia", "ds004504", "cross-validation", "foundation models"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Private :: Do Not Upload",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "mne>=1.8",
    "pyriemann>=0.7",
    "specparam>=2.0.0rc1",
    "lightgbm>=4.5",
    "antropy>=0.1.6",
    "joblib>=1.4",
    "pyarrow>=17",       # parquet epoch-level predictions
    "matplotlib>=3.9",
    "psutil>=7.2.2",
]

[project.urls]
Repository = "https://github.com/happyc0der/eeg-dementia-graph-transformer"
Dataset = "https://openneuro.org/datasets/ds004504"

[project.optional-dependencies]
# Phase 2 deep models. Pick exactly one torch flavour:
#   uv sync --extra deep --extra cpu      (any machine)
#   uv sync --extra deep --extra cu128    (NVIDIA GPU, CUDA 12.8 wheels)
# torch is pinned to 2.11 because braindecode needs torchaudio, whose last release is 2.11.
deep = ["braindecode[hub]==1.8.1", "huggingface_hub>=0.30", "safetensors>=0.4"]
cpu = ["torch==2.11.*", "torchaudio==2.11.*"]
cu128 = ["torch==2.11.*", "torchaudio==2.11.*"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eegdementia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
extend-exclude = ["legacy"]  # the Spring-2025 code is kept as it was

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
    "E501",    # long lines: tables and formulas read better unwrapped
    "B008",    # frozen (immutable) dataclass instances as argument defaults are fine
    "RUF001",  # "±", "µ", "Δ" in strings are intended
    "RUF002",
    "RUF003",
    "RUF005",  # list concatenation is clearer than unpacking here
    "RUF046",  # int(round(x)) kept for readability
    "B905",    # zip(strict=True) is used where lengths must match; elsewhere they match by construction
]
